[platformio]
default_envs = inlet

[env]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7
    knolleary/PubSubClient@^2.8
build_flags =
    -I src
    -D FW_VERSION=\"0.1.0-dev\"
    -D USE_FAKE_SENSORS
; sensor nodes never compile the parked valve code
build_src_filter = +<*> -<nodes/sv_node/> -<sensors/pressure.cpp>

[env:inlet]
build_flags = ${env.build_flags} -D NODE_ID=\"inlet\"

[env:outlet]
build_flags = ${env.build_flags} -D NODE_ID=\"outlet\"
