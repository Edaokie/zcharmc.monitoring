name: Firmware CI
on:
  push:
    paths: ['firmware/**', '.github/workflows/firmware-*.yml']
  pull_request:
    paths: ['firmware/**', '.github/workflows/firmware-*.yml']
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s firmware/tests_host -v
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [inlet, outlet, control]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-idf-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini', 'firmware/sdkconfig.defaults') }}
      - run: pip install platformio==6.1.19
      - run: pio run -d firmware -e '${{ matrix.profile }}'
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.profile }}-${{ github.sha }}
          path: firmware/.pio/build/${{ matrix.profile }}/firmware.bin
          if-no-files-found: error
          retention-days: 14
