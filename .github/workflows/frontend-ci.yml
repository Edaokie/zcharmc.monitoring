# Compile and validate every pushed commit. Hosting uses native Git integration.

name: Frontend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-typecheck-build:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest

    env:
      VITE_BACKEND_URL: "http://localhost:5001"
      NITRO_PRESET: vercel

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 💾 Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 📦 Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: 🧹 Lint — ESLint
        working-directory: frontend
        run: bun run lint

      - name: 🔷 Type check — TypeScript
        working-directory: frontend
        run: bun run tsc --noEmit --project tsconfig.json

      - name: Verify delayed uploads and reconnect replay
        working-directory: frontend
        run: bun run test

      - name: 🏗️ Build — production bundle
        working-directory: frontend
        run: bun run build

      - name: 📤 Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: frontend/.vercel/output
          retention-days: 14
          if-no-files-found: warn

      - name: 📊 Build size summary
        if: success()
        working-directory: frontend
        run: |
          echo "=== Build output size ==="
          du -sh .vercel/output
          echo ""
          echo "=== Top-level files ==="
          ls -lh .vercel/output/
