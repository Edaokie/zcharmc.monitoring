# GitHub Actions CI workflow for the React frontend.
# Runs on every push/PR to develop that touches the frontend/ folder.
# Steps: checkout → Bun setup → cache → install → lint → type check → build → upload artifact

name: Frontend CI

on:
  push:
    branches:
      - develop
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches:
      - develop
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  lint-typecheck-build:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest

    env:
      VITE_BACKEND_URL: "http://localhost:5001"

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 💾 Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 📦 Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: 🧹 Lint — ESLint
        working-directory: frontend
        run: bun run lint

      - name: 🔷 Type check — TypeScript
        working-directory: frontend
        run: bun run tsc --noEmit --project tsconfig.json

      - name: 🏗️ Build — production bundle
        working-directory: frontend
        run: bun run build

      - name: 📤 Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: frontend/.output
          retention-days: 14
          if-no-files-found: warn

      - name: 📊 Build size summary
        if: success()
        working-directory: frontend
        run: |
          echo "=== Build output size ==="
          du -sh .output 2>/dev/null || echo "(.output folder not found)"
          echo ""
          echo "=== Top-level files ==="
          ls -lh .output/ 2>/dev/null || true
