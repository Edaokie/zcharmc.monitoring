name: Signed Firmware Release
on:
  push:
    tags: ['firmware-v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing firmware-vX.Y.Z release to verify and register again (no rebuild or republish)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: firmware-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Hosting owner must configure required reviewers for this environment.
    environment: firmware-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check delivery configuration
        env:
          GH_TOKEN: ${{ github.token }}
          OTA_BACKEND_URL: ${{ vars.OTA_BACKEND_URL }}
          OTA_RELEASE_REGISTRATION_KEY: ${{ secrets.OTA_RELEASE_REGISTRATION_KEY }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          backend = urlparse(os.environ.get('OTA_BACKEND_URL', ''))
          if (backend.scheme != 'https' or not backend.hostname or backend.username or backend.password
                  or backend.query or backend.fragment or backend.path not in ('', '/')):
              raise SystemExit('Configure firmware-release variable OTA_BACKEND_URL as an HTTPS origin')
          if not os.environ.get('OTA_RELEASE_REGISTRATION_KEY'):
              raise SystemExit('Configure firmware-release secret OTA_RELEASE_REGISTRATION_KEY to match Django')
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = false || {
            echo 'The current ESP32 downloader requires public GitHub release assets.' >&2
            exit 1
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-idf-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini', 'firmware/sdkconfig.defaults') }}
      - run: pip install platformio==6.1.19
      - name: Validate tag and run release tests
        run: |
          python - <<'PY'
          import os, re
          version = os.environ['GITHUB_REF_NAME'].removeprefix('firmware-v')
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?', version) and len(version) <= 31, 'Invalid firmware version tag'
          PY
          python -m unittest discover -s firmware/tests_host -v
      - name: Build all role profiles from the tagged commit
        run: |
          export ZC_FW_VERSION="${GITHUB_REF_NAME#firmware-v}"
          mkdir -p /tmp/firmware-input
          for profile in inlet outlet control; do
            pio run -d firmware -e "$profile"
            cp "firmware/.pio/build/$profile/firmware.bin" "/tmp/firmware-input/$profile.bin"
          done
      - name: Sign and verify immutable release package
        env:
          SIGNING_KEY: ${{ secrets.FIRMWARE_SIGNING_PRIVATE_KEY }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          key = os.environ.get('SIGNING_KEY', '')
          if not key:
              raise SystemExit('Configure FIRMWARE_SIGNING_PRIVATE_KEY in the protected firmware-release environment')
          path = Path(os.environ['RUNNER_TEMP']) / 'firmware-signing.pem'
          path.touch(mode=0o600)
          path.write_text(key)
          PY
          python firmware/tools/release_package.py package \
            --input /tmp/firmware-input --output /tmp/firmware-release \
            --version "${GITHUB_REF_NAME#firmware-v}" --hardware wroom32-4mb-v1 \
            --commit "$GITHUB_SHA" --key "$RUNNER_TEMP/firmware-signing.pem" \
            --trusted-key firmware/keys/release-public.pem
      - name: Publish versioned GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" /tmp/firmware-release/* \
            --verify-tag --title "$GITHUB_REF_NAME" \
            --notes 'Signed native ESP-IDF bench firmware for inlet, outlet and control. Control remains maintenance-only. Publishing does not approve installation; select targets through Django admin.'
      - name: Remove ephemeral signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/firmware-signing.pem"
  register:
    name: Verify published assets and register in Django
    needs: release
    if: >-
      always() && !cancelled() &&
      (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: firmware-release
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      OTA_BACKEND_URL: ${{ vars.OTA_BACKEND_URL }}
      OTA_RELEASE_REGISTRATION_KEY: ${{ secrets.OTA_RELEASE_REGISTRATION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify the published release, then register it
        run: |
          python - <<'PY'
          import os, re
          tag = os.environ['RELEASE_TAG']
          version = tag.removeprefix('firmware-v')
          if (not tag.startswith('firmware-v') or len(version) > 31
                  or not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?', version)):
              raise SystemExit('Enter a firmware-v semantic version tag')
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = false
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          release_commit="$(git rev-parse 'FETCH_HEAD^{commit}')"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/published-firmware"
          python firmware/tools/register_release.py \
            --directory "$RUNNER_TEMP/published-firmware" \
            --trusted-key firmware/keys/release-public.pem \
            --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --commit "$release_commit"
          echo '### Firmware registered' >> "$GITHUB_STEP_SUMMARY"
          echo 'Three signed role releases are registered. New records remain disabled; review and approve devices in Django admin.' >> "$GITHUB_STEP_SUMMARY"
