name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  django-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zcharmc
          POSTGRES_USER: zcharmc
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zcharmc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://zcharmc:ci-only-password@localhost:5432/zcharmc
      DJANGO_SECRET_KEY: ci-only-secret-not-used-in-deployments
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_DEBUG: "false"
      ALLOW_PUBLIC_READ: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test tests --verbosity 2
      - name: Build Railway image
        run: docker build --tag zcharmc-backend:ci .
      - name: Smoke test production server
        run: |
          gunicorn config.wsgi:application --config gunicorn.conf.py &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:5001/api/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1
