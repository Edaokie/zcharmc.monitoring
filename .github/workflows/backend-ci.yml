# GitHub Actions CI workflow for the Flask backend.
# Runs on every push/PR to develop that touches the backend/ folder.
# Steps: checkout → Python setup → pip cache → install deps → lint → test → smoke test

name: Backend CI

on:
  push:
    branches:
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches:
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  lint-test-smoke:
    name: Lint, Test & Smoke Test
    runs-on: ubuntu-latest

    env:
      FLASK_APP: app.py
      FLASK_ENV: production
      FLASK_RUN_PORT: 5001
      MQTT_BROKER: "127.0.0.1"
      MQTT_PORT: "1883"
      MQTT_TOPIC: "co2monitor/#"
      SECRET_KEY: "ci-dummy-secret-key"

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 💾 Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 📦 Install dependencies
        run: pip install -q -r backend/requirements.txt

      - name: 🔍 Install linting tools
        run: pip install -q flake8

      - name: 🧹 Lint — flake8
        run: |
          flake8 backend/app.py \
            --max-line-length=120 \
            --extend-ignore=E501,W503,E402,E221,W292,W293,F541,E302,E305 \
            --exclude=backend/venv \
            --statistics

      - name: 🧪 Install test tools
        run: pip install -q pytest

      - name: ✅ Run tests — pytest
        working-directory: backend
        run: pytest tests/ -v -p no:warnings

      - name: 🚀 Smoke test — Flask server startup
        working-directory: backend
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, '.')
          os.makedirs('instance', exist_ok=True)
          from app import init_db
          init_db()
          print('[CI] Database initialized')
          "

          python -m flask run --host=0.0.0.0 --port=5001 > flask_ci.log 2>&1 &
          FLASK_PID=$!
          echo "Flask started with PID $FLASK_PID"

          echo "Waiting for Flask to boot..."
          sleep 5

          echo "Testing /api/health..."
          curl --fail --silent --show-error http://localhost:5001/api/health
          echo ""
          echo "✅ /api/health responded successfully"

          echo "Testing / ..."
          curl --fail --silent --show-error http://localhost:5001/
          echo ""
          echo "✅ / responded successfully"

          kill $FLASK_PID || true
          echo "Flask stopped."

      - name: 🪵 Print Flask logs on failure
        if: failure()
        working-directory: backend
        run: |
          echo "=== Flask server log ==="
          cat flask_ci.log || echo "(no log file found)"
