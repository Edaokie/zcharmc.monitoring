[env:lilygo-t-display-s3]
platform = espressif32
board = lilygo-t-display-s3
framework = arduino

[platformio]
description =  real-time microcomputer-based CO2  sensing technology to  evaluate the CO2  adsorption efficiency of self-supporting zeolite-activated biochar composites  by measuring the captured and released CO2  levels.
